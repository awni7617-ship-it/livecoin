#:schema node_modules/wrangler/config-schema.json
# Deliberately not called "forecourt" — that name is already taken by another
# Worker on this account and deploying would replace it. Rename freely.
name = "forecourt-app"
main = "src/index.js"
compatibility_date = "2025-09-23"

# Front end (public/) is served straight from Cloudflare's edge.
# Anything under /api/* runs the Worker instead.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# The database. Already created on this Cloudflare account, so deploying needs
# no setup step. Deploying to a different account? Run `npm run setup`, or
# delete the database_id line and Cloudflare will provision one for you.
[[d1_databases]]
binding = "DB"
database_name = "forecourt"
database_id = "2f89b92d-9233-4ec2-b04d-7457deb3dcc7"

[observability]
enabled = true

# Optional secrets (set with `npx wrangler secret put <NAME>`):
#
#   DVLA_API_KEY        UK DVLA Vehicle Enquiry Service key -> live make, colour,
#                       fuel, engine size, CO2, MOT + tax status from the plate.
#                       Free key: https://developer-portal.driver-vehicle-licensing.api.gov.uk/
#
#   MOT_CLIENT_ID       DVSA MOT History API credentials -> the model DVLA does
#   MOT_CLIENT_SECRET   not hold, plus every recorded MOT odometer reading, so
#   MOT_API_KEY         mileage can be checked against the car's own history.
#                       Free: https://documentation.history.mot.api.gov.uk/
#
#   LOOKUP_URL          Any other plate provider, e.g.
#                       "https://api.example.com/lookup?reg={plate}"
#   LOOKUP_HEADER       Header name for that provider's key (default "x-api-key")
#   LOOKUP_KEY          The key value itself
#
# Without any of these the app still identifies the plate offline (format, age,
# issuing region, first-registration window) and VINs via the free NHTSA database.

#:schema node_modules/wrangler/config-schema.json
name = "forecourt"
main = "src/index.js"
compatibility_date = "2025-09-23"

# Front end (public/) is served straight from Cloudflare's edge.
# Anything under /api/* runs the Worker instead.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# The database. `npm run setup` creates it and fills in database_id for you.
[[d1_databases]]
binding = "DB"
database_name = "forecourt"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[observability]
enabled = true

# Optional secrets (set with `npx wrangler secret put <NAME>`):
#
#   DVLA_API_KEY        UK DVLA Vehicle Enquiry Service key -> live make, colour,
#                       fuel, engine size, CO2, MOT + tax status from the plate.
#                       Free key: https://developer-portal.driver-vehicle-licensing.api.gov.uk/
#
#   LOOKUP_URL          Any other plate provider, e.g.
#                       "https://api.example.com/lookup?reg={plate}"
#   LOOKUP_HEADER       Header name for that provider's key (default "x-api-key")
#   LOOKUP_KEY          The key value itself
#
# Without any of these the app still identifies the plate offline (format, age,
# issuing region, first-registration window) and VINs via the free NHTSA database.
